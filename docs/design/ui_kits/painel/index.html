#root{min-height:100vh}
@keyframes pnPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pnSpin{to{transform:rotate(360deg)}}
@keyframes pnPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes pnFade{from{opacity:0}to{opacity:1}}
@keyframes pnUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes stFade{from{opacity:0}to{opacity:1}}
@keyframes stPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
</style>
