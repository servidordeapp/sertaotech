# Stack local do monorepo. Único pré-requisito na máquina é o Docker:
#
#   docker compose up        # sobe site + painel + api + banco + RustFS
#   docker compose down      # derruba
#
# O `api/compose.yaml` (Laravel Sail) continua lá para quem usa o `sail`, mas
# não é incluído aqui: ele constrói a imagem a partir de
# `api/vendor/laravel/sail/runtimes/`, que só existe depois de um
# `composer install` no host — num clone novo um `include` derrubaria o
# `docker compose up` do site também. A api aqui usa o `api/Dockerfile`, que
# roda o composer dentro da imagem.
services:
  site:
    build:
      context: ./site
      target: dev
    # Se o navegador parar de recarregar sozinho ao editar um arquivo,
    # descomente: liga o polling do watcher do Vite (ver o comentário em
    # site/astro.config.mjs). Medido em 2026-11-03 como desnecessário — o
    # container viu as edições do host como o próprio host.
    # environment:
    #   VITE_POLLING: '1'
    environment:
      # Sem isto o formulário da lista de espera cai no fallback do código
      # (api.osertaotech.com.br) e o teste local escreveria em produção.
      PUBLIC_API_URL: 'http://localhost:8000'
    ports:
      - '4321:4321'
    volumes:
      # Código do host, para o hot reload ver as edições.
      - ./site:/app
      # Volume anônimo: sem ele o bind mount acima cobriria o node_modules
      # instalado na imagem, e o container subiria sem dependência nenhuma.
      - /app/node_modules

  painel:
    build:
      context: ./painel
      target: dev
    environment:
      # Sem isto o painel cai no fallback do código (api.osertaotech.com.br) e
      # o login local tentaria autenticar contra produção.
      VITE_API_URL: 'http://localhost:8000'
    ports:
      - '5173:5173'
    volumes:
      - ./painel:/app
      # Volume anônimo, pelo mesmo motivo do site.
      - /app/node_modules
      # Tokens e logo do design system, importados de `../../site/public`. Em
      # /site porque o caminho relativo tem de valer dentro e fora do container.
      - ./site/public:/site/public:ro

  api:
    build:
      context: ./api
      target: dev
    # 8000 é o que o APP_URL do api/.env.example já aponta.
    ports:
      - '8000:8000'
    volumes:
      # Código do host: o servidor embutido do PHP lê o arquivo a cada
      # requisição, então editar um controller já vale na próxima chamada.
      - ./api:/app
      # Volume anônimo, pelo mesmo motivo do node_modules do site: sem ele o
      # bind mount cobriria o vendor instalado na imagem.
      - /app/vendor
    # Variável de ambiente ganha do api/.env, então os anexos daqui nunca vão para o R2.
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: osertaotech
      AWS_ENDPOINT: 'http://rustfs:9000'
      AWS_URL: 'http://localhost:9000/osertaotech'
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
      # Pelo mesmo motivo, o e-mail daqui nunca sai para o provedor real: cai no
      # Mailpit, em http://localhost:8025.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SCHEME: smtp
      # Botão do e-mail e QR Code do PDF abrem o site local, não o de produção.
      CERTIFICADO_URL_PAGINA: 'http://localhost:4321/certificado'
      CERTIFICADO_URL_VALIDACAO: 'http://localhost:4321/certificado/validar'
    depends_on:
      mailpit:
        condition: service_started
      mysql:
        # O boot roda `artisan migrate`, que precisa do banco de pé, não só do
        # container criado.
        condition: service_healthy
      rustfs-bucket:
        condition: service_completed_successfully

  # Caixa de entrada falsa: guarda todo e-mail que a api manda e mostra em
  # http://localhost:8025. Nada chega a ninguém de verdade.
  mailpit:
    image: 'axllent/mailpit:v1.27.0'
    ports:
      - '8025:8025'

  # O lugar do Cloudflare R2 em dev: mesma api S3, sem conta nem custo. Console em
  # http://localhost:9001, com o usuário e a senha abaixo.
  rustfs:
    image: 'rustfs/rustfs:1.0.4'
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs:/data

  # Cria o bucket, deixa a leitura pública como no R2 e sai. O RustFS não cria sozinho,
  # e o curl assina S3 sem precisar de cliente nenhum. 409 é "já existe", o normal a
  # partir do segundo boot.
  rustfs-bucket:
    image: 'curlimages/curl:8.11.1'
    entrypoint: ['sh', '-c']
    command:
      - |
        until codigo=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
          -u rustfsadmin:rustfsadmin -X PUT http://rustfs:9000/osertaotech) \
          && { [ "$$codigo" = 200 ] || [ "$$codigo" = 409 ]; }; do sleep 1; done
        curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 -u rustfsadmin:rustfsadmin -X PUT \
          -d '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::osertaotech/*"}]}' \
          'http://rustfs:9000/osertaotech?policy='
    depends_on:
      - rustfs

  mysql:
    image: 'mysql:8.4'
    # Credenciais do `api/.env.example` (as mesmas do Sail). Banco local e
    # descartável; nada daqui vale em produção.
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql:/var/lib/mysql
      # Cria o banco `testing` do phpunit no primeiro boot do volume.
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql:
  rustfs:
