# Deploy to shared hosting (cPanel-style: FTP sync + SSH post-deploy).
#
# Written by the laravel-project-setup skill. The placeholders below are filled
# in when the file is installed — edit assets/deploy/shared-hosting.yml in the
# skill to change the pipeline for every project, or this file to change it for
# this one.
#
# The pipeline is split into three jobs on purpose: quality → sync → post-deploy.
# When one of them fails, "Re-run failed jobs" replays only that job (and what
# depends on it), so an SSH hiccup no longer forces a full rebuild and re-upload.
# A aplicacao e API-only: nao ha build de front-end nem artefato entre jobs.
#
# Repository configuration this workflow expects:
#   vars.FTP_HOST      hostname of the server (kept the name: same host as FTP)
#   vars.FTP_USER      username used for SSH
#   secrets.FTP_PASSWORD  password used for SSH
#   vars.SSH_HOST      optional — defaults to vars.FTP_HOST
#   vars.SSH_PORT      optional — defaults to 22 (cPanel costuma usar 22222)
name: Deploy API

# Monorepo: o workflow mora na raiz (o GitHub só lê .github/workflows de lá),
# mas a aplicação é api/. O filtro de path evita rodar o deploy da API quando o
# push só mexeu em site/ ou docs/.
on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  # Relativo a home da conta SSH (/home2/<usuario>), nao absoluto: o FTP
  # resolvia /apps/api/ dentro do chroot da conta, o ssh resolveria na raiz do
  # filesystem. Com caminho relativo, rsync e o `cd` do post-deploy caem os
  # dois em ~/apps/api.
  REMOTE_DIR: apps/api/

jobs:
  quality:
    name: Quality gate & build
    runs-on: ubuntu-24.04

    # Todo comando `run` deste job executa dentro de api/ (não afeta os `uses`).
    defaults:
      run:
        working-directory: api

    # A suite roda contra MySQL, o mesmo banco da produção. Sem este service o
    # runner não resolve o host `mysql` do Sail e todos os testes falham no
    # connect.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          extensions: pdo_mysql
          # `composer coverage` refuses to run without pcov or xdebug, so this
          # must stay a real driver: with coverage: none the quality gate below
          # fails on every push.
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Static Analysis
        run: composer stan

      - name: Run Pint
        run: composer pint

      # Enforces the --min the setup baked into composer.json (COVERAGE_MIN,
      # 90 by default). A project without a suite yet fails here — lower the
      # threshold in composer.json, or drop this step until there are tests.
      - name: Check coverage
        run: composer coverage


  sync:
    name: rsync via SSH
    runs-on: ubuntu-24.04
    needs: quality

    # Era FTPS, mas o cPanel exige reuso da sessao TLS do canal de controle no
    # canal de dados e o basic-ftp (lib da FTP-Deploy-Action) nao faz isso: o
    # upload morria no meio com "tlsv1 alert decode error" (SSL alert 50).
    # rsync usa o mesmo SSH do post-deploy, criptografado e com delta real.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync sshpass

      # --delete remove do servidor o que saiu do repositorio, para nao deixar
      # codigo velho servindo. O que esta em deploy-api-exclude.txt fica
      # protegido: rsync nao apaga arquivo excluido (sem --delete-excluded).
      - name: Sync api/ to the server
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SSH_USER: ${{ vars.FTP_USER }}
          SSH_TARGET: ${{ vars.SSH_HOST || vars.FTP_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          sshpass -e rsync -rltzv --delete \
            --exclude-from=.github/deploy-api-exclude.txt \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null" \
            ./api/ "$SSH_USER@$SSH_TARGET:$REMOTE_DIR"

  post-deploy:
    name: SSH post-deploy
    runs-on: ubuntu-24.04
    needs: sync

    steps:
      # Idempotente: pode ser re-executado sozinho após uma falha de SSH, sem
      # refazer o build nem o upload.
      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SSH_HOST || vars.FTP_HOST }}
          username: ${{ vars.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e
            PHP=/usr/local/bin/php
            cd ${{ env.REMOTE_DIR }}
            # O .env de producao e colocado a mao, uma vez, e o rsync nao o
            # envia nem apaga. Sem ele o migrate abaixo morre em "could not
            # find driver" ou numa APP_KEY vazia, que nao diz o que falta.
            [ -f .env ] || { echo "ERRO: ${{ env.REMOTE_DIR }}.env nao existe no servidor. Suba o .env de producao e re-execute este job."; exit 1; }
            # O composer nao vem no repositorio nem sobe pelo rsync. Ordem:
            # o que o cPanel ja instala, o que estiver no PATH, um .phar que
            # um deploy anterior tenha baixado e, por ultimo, baixar.
            if [ -x /opt/cpanel/composer/bin/composer ]; then
              COMPOSER="$PHP /opt/cpanel/composer/bin/composer"
            elif command -v composer >/dev/null 2>&1; then
              COMPOSER="composer"
            elif [ -f composer.phar ]; then
              COMPOSER="$PHP composer.phar"
            else
              # Hash conferido antes de executar: o phar roda com as
              # credenciais da conta, download sem verificacao nao serve.
              curl -sSf -o composer.phar https://getcomposer.org/composer-stable.phar
              curl -sSf -o composer.phar.sha256 https://getcomposer.org/composer-stable.phar.sha256sum
              echo "$(cut -d' ' -f1 composer.phar.sha256)  composer.phar" | sha256sum -c -
              rm -f composer.phar.sha256
              COMPOSER="$PHP composer.phar"
            fi
            # Manda as requisições da raiz para public/. O .htaccess da raiz não
            # vai para o git porque o cPanel grava nele o handler do PHP; aqui só
            # acrescentamos o rewrite quando ele ainda não existe.
            grep -qF 'public/$1' .htaccess 2>/dev/null || cat >> .htaccess <<'EOF'

            <IfModule mod_rewrite.c>
                RewriteEngine on
                RewriteRule ^(.*)$ public/$1 [L]
            </IfModule>
            EOF
            # Diagnostico: o handler e escrito pelo MultiPHP Manager do cPanel,
            # nao pelo deploy. Se sumir, o dominio cai no PHP padrao da conta e
            # o Laravel morre com "requires a PHP version >= 8.4.1" so no
            # browser, enquanto o php do ssh continua 8.5.
            grep -q 'AddHandler' .htaccess 2>/dev/null || echo "AVISO: .htaccess da raiz sem AddHandler. Confira o MultiPHP Manager para api.osertaotech.com.br."
            mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public
            chmod -R 775 storage bootstrap/cache
            rm -f bootstrap/cache/*.php
            $COMPOSER install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            $PHP artisan optimize:clear
            $PHP artisan migrate --force
            $PHP artisan optimize
            $PHP artisan queue:restart
